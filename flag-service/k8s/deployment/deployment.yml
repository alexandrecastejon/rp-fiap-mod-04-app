apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-deployment
  namespace: "eks-namespace"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      initContainers:
      - name: flag-db-migration
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "Iniciando criacao da tabela no banco flags_db..."
          psql $DATABASE_URL <<'EOF'
          CREATE TABLE IF NOT EXISTS flags (
              id SERIAL PRIMARY KEY,
              -- 'name' é a chave de negócio única (ex: 'enable-new-checkout')
              name VARCHAR(100) UNIQUE NOT NULL, 
              description TEXT,

              -- Este é o 'kill switch' global. Se for false, a flag está desativada para todos.
              is_enabled BOOLEAN NOT NULL DEFAULT false,

              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          -- Opcional, mas boa prática: Trigger para atualizar 'updated_at' automaticamente
          CREATE OR REPLACE FUNCTION trigger_set_timestamp()
          RETURNS TRIGGER AS $$
          BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          -- Remove o trigger se já existir, para evitar erro na recriação
          DROP TRIGGER IF EXISTS set_timestamp ON flags;

          CREATE TRIGGER set_timestamp
          BEFORE UPDATE ON flags
          FOR EACH ROW
          EXECUTE PROCEDURE trigger_set_timestamp();
          EOF
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flag-secret
              key: DATABASE_URL
      containers:
        - name: flag-container
          image: 162521700965.dkr.ecr.us-east-1.amazonaws.com/ecr-flag-service-01:v1.0.7c5d92dad85e0e3b6c8d597b21993edabf2e893e
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: flag-config
                  key: AUTH_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-secret
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"