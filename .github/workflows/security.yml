name: FIAP - MODULO 04 - APP - SECURITY

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: SECRET SCAN - GITLEAKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gitleaks - Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
