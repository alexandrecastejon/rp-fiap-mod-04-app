# Pipeline DevSecOps do serviço
#   PR e push na main: SCA (Trivy fs) -> build/lint/testes com cobertura -> SAST (SonarCloud +
#                      quality gate com a cobertura) -> build da imagem -> container scan (Trivy)
#                      — bloqueia em vulnerabilidade CRÍTICA ou quality gate reprovado
#   Somente push na main: push no ECR (OIDC) -> deploy dos manifests -> atualização da tag no GitOps (ArgoCD)
name: FIAP - MODULO 04 - APP - TARGETING SERVICE

on:
  push:
    branches:
      - main
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service.yml'
  pull_request:
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service.yml'
  workflow_dispatch:

# Menor privilégio por padrão; jobs que precisam de mais declaram explicitamente
permissions:
  contents: read

env:
  SERVICE_NAME: 'targeting-service'
  ECR_REPOSITORY_NAME: 'ecr-targeting-service-01'
  EKS_NAMESPACE: 'eks-namespace'
  PYTHON_VERSION: '3.11'

jobs:
  sca:
    name: SCA - TRIVY - FILE SYSTEM SCAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy - Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ github.workspace }}/${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  sast:
    name: SAST - SONARCLOUD - CODE ANALYSIS
    # Roda depois dos testes para analisar também a cobertura
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Coverage - Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-${{ env.SERVICE_NAME }}
          path: ${{ env.SERVICE_NAME }}

      - name: SonarCloud - Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
        with:
          projectBaseDir: ${{ env.SERVICE_NAME }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ github.event.repository.name }}/${{ env.SERVICE_NAME }}
            -Dsonar.projectKey=${{ github.event.repository.name }}_${{ env.SERVICE_NAME }}
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.js,**/*.spec.js,**/*.d.ts,**/*.json,**/*.yml,**/*.yaml,**/*.md,**/test_*.py

  build-and-test:
    name: BUILD, LINT AND UNIT TESTS - SERVICE - TARGETING
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python - Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Python - Install Dependencies
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8==7.4.1 pytest==9.1.1 pytest-cov==7.1.0

      - name: Flake8 - Linter
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --statistics

      - name: Python - Run - Unit Tests
        working-directory: ${{ env.SERVICE_NAME }}
        run: pytest --cov=. --cov-report=xml:coverage.xml

      - name: Coverage - Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ env.SERVICE_NAME }}
          path: ${{ env.SERVICE_NAME }}/coverage.xml
          retention-days: 1

  docker-build:
    name: DOCKER BUILD - SERVICE - TARGETING
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: 'v1.0.${{ github.sha }}'
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Docker Hub - Configure
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Build Image
        run: |
          echo "##[section]Building the Docker Image..."
          docker build -t ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} ${{ env.SERVICE_NAME }}

      # O scan acontece ANTES do push: imagem com vulnerabilidade CRÍTICA nunca chega ao ECR
      - name: Trivy - Container Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

      - name: AWS Credentials - Configure (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR - Connect
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: ECR - Push Image
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "##[section]Pushing Image to ECR..."
          docker tag ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
  deploy:
    name: DEPLOY - SERVICE - TARGETING
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      EKS_CLUSTER_NAME: 'eks-cluster-01'
      AWS_RDS_NAME: 'rds-targeting-db-01'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: EKS Cluster - Create Dependencies
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          echo "======= EKS Cluster - Create Dependencies ========"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Getting RDS Endpoint..."
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.AWS_RDS_NAME }} \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)
          echo "##[section]Endpoint found: $RDS_ENDPOINT"

          echo "##[section]Applying Manifests..."
          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/manifests/manifests.yml
          sed -i "s|postgres://#{db_user}#:#{db_pass}#@#{rds_endpoint}#|postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@$RDS_ENDPOINT|g" k8s/manifests/manifests.yml
          kubectl apply -f k8s/manifests/manifests.yml

      - name: GitOps - Tag Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/deployment/deployment.yml
          sed -i "s|image: .*/${{ env.ECR_REPOSITORY_NAME }}:.*|image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG|g" k8s/deployment/deployment.yml

          git add k8s/deployment/deployment.yml
          git commit -m "chore(gitops): atualiza imagem do ${{ env.SERVICE_NAME }} para a tag $IMAGE_TAG [skip ci]" || true

          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && \
            break || \
            echo "Conflito de concorrência. Tentando novamente em 5 segundos..." && \
            sleep 5
            git rebase --abort || true
            git pull origin main --strategy-option theirs || true
          done