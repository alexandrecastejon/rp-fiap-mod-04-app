name: FIAP - MODULO 04 - APP - EVALUATION SERVICE

on:
  push:
    branches:
      - main
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service.yml'
  pull_request:
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service.yml'
  workflow_dispatch:

# Menor privilégio por padrão; jobs que precisam de mais declaram explicitamente
permissions:
  contents: read

env:
  SERVICE_NAME: 'evaluation-service'
  ECR_REPOSITORY_NAME: 'ecr-evaluation-service-01'
  EKS_NAMESPACE: 'eks-namespace'
  GO_VERSION: '1.26'

jobs:
  sca:
    name: SCA - TRIVY - FILE SYSTEM SCAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy - Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ github.workspace }}/${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  sast:
    name: SAST - SONARCLOUD - CODE ANALYSIS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: SonarCloud - Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
        with:
          projectBaseDir: ${{ env.SERVICE_NAME }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ github.event.repository.name }}/${{ env.SERVICE_NAME }}
            -Dsonar.projectKey=${{ github.event.repository.name }}_${{ env.SERVICE_NAME }}
            -Dsonar.go.version=${{ env.GO_VERSION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.js,**/*.spec.js,**/*.d.ts,**/*.json,**/*.yml,**/*.yaml,**/*.md

  build-and-test:
    name: BUILD, LINT AND UNIT TESTS - SERVICE - EVALUATION
    needs: [sca, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go - Setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '${{ env.SERVICE_NAME }}/go.sum'

      - name: Go - Install Dependencies
        working-directory: ${{ env.SERVICE_NAME }}
        run: go mod download

      - name: Linter - golangci-lint
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          $(go env GOPATH)/bin/golangci-lint run

      - name: Go - Run - Unit Tests
        working-directory: ${{ env.SERVICE_NAME }}
        run: go test -v ./...

      - name: Go - Run - Build
        working-directory: ${{ env.SERVICE_NAME }}
        run: go build -v -o main .

  docker-build:
    name: DOCKER BUILD - SERVICE - EVALUATION
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: 'v1.0.${{ github.sha }}'
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Hub - Configure
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Build Image
        run: |
          echo "##[section]Building the Docker Image..."
          docker build -t ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} ${{ env.SERVICE_NAME }}

      # O scan acontece ANTES do push: imagem com vulnerabilidade CRÍTICA nunca chega ao ECR
      - name: Trivy - Container Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

      - name: AWS Credentials - Configure (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR - Connect
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: ECR - Push Image
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "##[section]Pushing Image to ECR..."
          docker tag ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
  deploy:
    name: DEPLOY - SERVICE - EVALUATION
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      EKS_CLUSTER_NAME: 'eks-cluster-01'
      AWS_SQS_NAME: 'EventQueue'
      AWS_REDIS_NAME: 'cache-cluster-01'
      AWS_EVALUATION_ROLE_NAME: 'evaluation-service-role'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: EKS Cluster - Create Dependencies
        env:
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          echo "======= EKS Cluster - Create Dependencies ========"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Getting SQS URL..."
          SQS_URL=$(aws sqs get-queue-url \
            --queue-name ${{ env.AWS_SQS_NAME }} \
            --query "QueueUrl" \
            --output text)
          echo "##[section]SQS URL found: $SQS_URL"

          echo "##[section]Getting Redis Endpoint..."
          REDIS_ENDPOINT=$(aws elasticache describe-cache-clusters \
            --cache-cluster-id ${{ env.AWS_REDIS_NAME }} \
            --show-cache-node-info \
            --query "CacheClusters[0].CacheNodes[0].Endpoint.Address" \
            --output text)
          echo "##[section]Redis Endpoint found: $REDIS_ENDPOINT"

          echo "##[section]Getting IAM Role ARN..."
          ROLE_ARN=$(aws iam get-role \
            --role-name ${{ env.AWS_EVALUATION_ROLE_NAME }} \
            --query "Role.Arn" \
            --output text)
          echo "##[section]IAM Role ARN found: $ROLE_ARN"

          echo "##[section]Applying Manifests..."
          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_sqs_url}#|$SQS_URL|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_cache_endpoint}#|$REDIS_ENDPOINT|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_evaluation_role_arn}#|$ROLE_ARN|g" k8s/manifests/manifests.yml
          sed -i "s|#{service_api_key}#|$SERVICE_API_KEY|g" k8s/manifests/manifests.yml
          kubectl apply -f k8s/manifests/manifests.yml

      - name: GitOps - Tag Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/deployment/deployment.yml
          sed -i "s|image: .*/${{ env.ECR_REPOSITORY_NAME }}:.*|image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG|g" k8s/deployment/deployment.yml

          git add k8s/deployment/deployment.yml
          git commit -m "chore(gitops): atualiza imagem do ${{ env.SERVICE_NAME }} para a tag $IMAGE_TAG [skip ci]" || true

          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && \
            break || \
            echo "Conflito de concorrência. Tentando novamente em 5 segundos..." && \
            sleep 5
            git rebase --abort || true
            git pull origin main --strategy-option theirs || true
          done