name: FIAP - MODULO 04 - APP - ANALYTICS SERVICE

on:
  push:
    branches:
      - main
    paths:
      - 'analytics-service/**'
      - '.github/workflows/analytics-service.yml'
  pull_request:
    paths:
      - 'analytics-service/**'
      - '.github/workflows/analytics-service.yml'
  workflow_dispatch:

# Menor privilégio por padrão; jobs que precisam de mais declaram explicitamente
permissions:
  contents: read

env:
  SERVICE_NAME: 'analytics-service'
  ECR_REPOSITORY_NAME: 'ecr-analytics-service-01'
  EKS_NAMESPACE: 'eks-namespace'
  PYTHON_VERSION: '3.11'

jobs:
  sca:
    name: SCA - TRIVY - FILE SYSTEM SCAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy - Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ github.workspace }}/${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  sast:
    name: SAST - SONARCLOUD - CODE ANALYSIS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: SonarCloud - Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
        with:
          projectBaseDir: ${{ env.SERVICE_NAME }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ github.event.repository.name }}/${{ env.SERVICE_NAME }}
            -Dsonar.projectKey=${{ github.event.repository.name }}_${{ env.SERVICE_NAME }}
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.js,**/*.spec.js,**/*.d.ts,**/*.json,**/*.yml,**/*.yaml,**/*.md

  build-and-test:
    name: BUILD, LINT AND UNIT TESTS - SERVICE - ANALYTICS
    needs: [sca, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python - Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Python - Install Dependencies
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Flake8 - Linter
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --statistics

      - name: Python - Run - Unit Tests
        working-directory: ${{ env.SERVICE_NAME }}
        run: pytest

  docker-build:
    name: DOCKER BUILD - SERVICE - ANALYTICS
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: 'v1.0.${{ github.sha }}'
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Docker Hub - Configure
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Build Image
        run: |
          echo "##[section]Building the Docker Image..."
          docker build -t ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} ${{ env.SERVICE_NAME }}

      # O scan acontece ANTES do push: imagem com vulnerabilidade CRÍTICA nunca chega ao ECR
      - name: Trivy - Container Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

      - name: AWS Credentials - Configure (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR - Connect
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: ECR - Push Image
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "##[section]Pushing Image to ECR..."
          docker tag ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
  deploy:
    name: DEPLOY - SERVICE - ANALYTICS
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      EKS_CLUSTER_NAME: 'eks-cluster-01'
      AWS_SQS_NAME: 'EventQueue'
      AWS_EVALUATION_ROLE_NAME: 'evaluation-service-role'
      AWS_ANALYTICS_ROLE_NAME: 'analytics-service-role'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: EKS Cluster - Create Dependencies
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          echo "======= EKS Cluster - Create Dependencies ========"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Getting SQS URL..."
          SQS_URL=$(aws sqs get-queue-url \
            --queue-name ${{ env.AWS_SQS_NAME }} \
            --query "QueueUrl" \
            --output text)
          echo "##[section]SQS URL found: $SQS_URL"

          echo "##[section]Getting IAM Role ARN..."
          EVALUATION_ROLE_ARN=$(aws iam get-role \
            --role-name ${{ env.AWS_EVALUATION_ROLE_NAME }} \
            --query "Role.Arn" \
            --output text)
          echo "##[section]IAM Role ARN found: $EVALUATION_ROLE_ARN"

          echo "##[section]Getting IAM Role ARN..."
          ANALYTICS_ROLE_ARN=$(aws iam get-role \
            --role-name ${{ env.AWS_ANALYTICS_ROLE_NAME }} \
            --query "Role.Arn" \
            --output text)
          echo "##[section]IAM Role ARN found: $ANALYTICS_ROLE_ARN"

          echo "##[section]Applying Manifests..."
          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_sqs_url}#|$SQS_URL|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_evaluation_role_arn}#|$EVALUATION_ROLE_ARN|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_analytics_role_arn}#|$ANALYTICS_ROLE_ARN|g" k8s/manifests/manifests.yml
          kubectl apply -f k8s/manifests/manifests.yml

      - name: GitOps - Tag Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/deployment/deployment.yml
          sed -i "s|image: .*/${{ env.ECR_REPOSITORY_NAME }}:.*|image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG|g" k8s/deployment/deployment.yml

          git add k8s/deployment/deployment.yml
          git commit -m "chore(gitops): atualiza imagem do ${{ env.SERVICE_NAME }} para a tag $IMAGE_TAG [skip ci]" || true

          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && \
            break || \
            echo "Conflito de concorrência. Tentando novamente em 5 segundos..." && \
            sleep 5
            git rebase --abort || true
            git pull origin main --strategy-option theirs || true
          done

  keda-load-test:
    name: TEST - SERVICE - ANALYTICS
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_SQS_NAME: 'EventQueue'
    environment: 'APPLY_APPROVAL'
    steps:
      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: gha-app-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: KEDA - Load Test
        run: |
          echo "##[section]Getting SQS URL..."
          SQS_URL=$(aws sqs get-queue-url \
            --queue-name ${{ env.AWS_SQS_NAME }} \
            --query "QueueUrl" \
            --output text)
          echo "##[section]SQS URL found: $SQS_URL"

          echo "Injetando 100 mensagens diretamente na SQS para forçar o KEDA a escalar..."
          for i in {1..100}; do
            aws sqs send-message \
              --queue-url "$SQS_URL" \
              --message-body "{\"user_id\": \"user-${i}\", \"flag_name\": \"enable-new-dashboard\", \"result\": true}" \
              --region us-east-1 > /dev/null
          done
          echo "Mensagens injetadas! Olhe o cluster em instantes."