apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-deployment
  namespace: "eks-namespace"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-sa
      initContainers:
        - name: token-fetcher
          image: curlimages/curl:latest
          command: ['sh', '-c']
          args:
            - |
              until curl -s -f http://auth-service.eks-namespace.svc.cluster.local:8001/health; do echo "Aguardando auth-service..."; sleep 5; done;
              TOKEN=$(curl -s -X POST http://auth-service.eks-namespace.svc.cluster.local:8001/admin/keys -H 'Content-Type: application/json' -H "Authorization: Bearer admin-secreto-123" -d '{"name": "evaluation-auto-key"}' | grep -o '"key":"[^"]*' | cut -d'"' -f4)
              echo $TOKEN > /shared-data/service-api-key.txt
          env:
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-secret
                  key: SERVICE_API_KEY
          volumeMounts:
            - name: shared-data
              mountPath: /shared-data
      containers:
        - name: evaluation-container
          image: 162521700965.dkr.ecr.us-east-1.amazonaws.com/ecr-evaluation-service-01:v1.0.a79ef18e298e61462b8a66b30e6aa62fa224a9bd
          ports:
            - containerPort: 8004
          command: ['sh', '-c']
          args:
            - |
              export SERVICE_API_KEY=$(cat /shared-data/service-api-key.txt) && /main
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: evaluation-config
                  key: AWS_REGION
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: evaluation-config
                  key: AUTH_SERVICE_URL
            - name: FLAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: evaluation-config
                  key: FLAG_SERVICE_URL
            - name: TARGETING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: evaluation-config
                  key: TARGETING_SERVICE_URL
            - name: AWS_SQS_URL
              valueFrom:
                secretKeyRef:
                  name: evaluation-secret
                  key: AWS_SQS_URL
            - name: AWS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: evaluation-secret
                  key: AWS_REDIS_URL
            - name: OTEL_SERVICE_NAME
              value: "evaluation-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          volumeMounts:
            - name: shared-data
              mountPath: /shared-data
      volumes:
        - name: shared-data
          emptyDir: {}