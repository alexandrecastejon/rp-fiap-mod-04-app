apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: "eks-namespace"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: auth-db-migration
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "Iniciando criacao das tabelas no banco auth_db..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v key_hash="$SERVICE_KEY_HASH" <<'EOF'
          CREATE TABLE IF NOT EXISTS api_keys (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              key_hash VARCHAR(64) NOT NULL UNIQUE,
              is_active BOOLEAN DEFAULT true,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          -- Registra a chave de serviço do evaluation-service (somente o hash SHA-256)
          INSERT INTO api_keys (name, key_hash) VALUES ('evaluation-service', :'key_hash')
          ON CONFLICT (key_hash) DO NOTHING;
          EOF
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: DATABASE_URL
        - name: SERVICE_KEY_HASH
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: SERVICE_KEY_HASH
      containers:
        - name: auth-container
          image: 851725564784.dkr.ecr.us-east-1.amazonaws.com/ecr-auth-service-01:v1.0.d81fe7ca204ec5b54a5aa6e6c1ea66af5c8027dd
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"